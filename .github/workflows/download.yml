name: DLX Download

# اجرای این workflow توسط برنامه‌ی DLX PRO Turbo انجام می‌شود (یا دستی از تب Actions).
run-name: "dlx ${{ inputs.tag || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (YouTube, Instagram, ...)"
        required: true
        type: string
      kind:
        description: "video or audio"
        required: false
        default: "video"
        type: string
      quality:
        description: "Max video height (0 = best)"
        required: false
        default: "0"
        type: string
      container:
        description: "mp4 / webm (video) or mp3 / m4a (audio)"
        required: false
        default: "mp4"
        type: string
      tag:
        description: "Job id / release tag (set by the app; leave empty when running by hand)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -U "yt-dlp[default]"

      - name: Prepare cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > cookies.txt
          fi

      - name: Download
        env:
          URL: ${{ inputs.url }}
          KIND: ${{ inputs.kind }}
          QUALITY: ${{ inputs.quality }}
          CONTAINER: ${{ inputs.container }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$URL" in http://*|https://*) ;; *) echo "invalid url"; exit 1;; esac
          if [ -z "$TAG" ]; then TAG="manual-$(date +%s)"; fi
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "invalid tag"; exit 1;; esac
          echo "REL_TAG=$TAG" >> "$GITHUB_ENV"
          case "$QUALITY" in *[!0-9]*|"") QUALITY=0;; esac
          mkdir -p out meta
          COOKIE_ARGS=()
          if [ -s cookies.txt ]; then COOKIE_ARGS=(--cookies cookies.txt); fi
          COMMON=(--no-playlist --no-warnings --newline --retries 10 --concurrent-fragments 4
                  --js-runtimes node --print-to-file "%(title)s" meta/title.txt
                  -o "out/media.%(ext)s")
          if [ "$KIND" = "audio" ]; then
            case "$CONTAINER" in mp3|m4a) ;; *) CONTAINER=mp3;; esac
            yt-dlp "${COOKIE_ARGS[@]}" "${COMMON[@]}" \
              -f "ba/b" -x --audio-format "$CONTAINER" --audio-quality 0 --embed-metadata -- "$URL"
          else
            case "$CONTAINER" in mp4|webm) ;; *) CONTAINER=mp4;; esac
            if [ "$QUALITY" = "0" ]; then
              FMT="bv*+ba/b"
            elif [ "$CONTAINER" = "webm" ]; then
              FMT="bv*[height<=${QUALITY}][ext=webm]+ba/bv*[height<=${QUALITY}]+ba/b[height<=${QUALITY}]"
            else
              FMT="bv*[height<=${QUALITY}][ext=mp4]+ba[ext=m4a]/bv*[height<=${QUALITY}]+ba/b[height<=${QUALITY}]"
            fi
            yt-dlp "${COOKIE_ARGS[@]}" "${COMMON[@]}" \
              -f "$FMT" --merge-output-format "$CONTAINER" -- "$URL"
          fi
          ls -lh out meta

      - name: Split files larger than 1.9 GB (GitHub asset limit is 2 GB)
        run: |
          cd out
          for f in *; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 2040000000 ]; then
              split -b 1900m -d -a 2 "$f" "$f.part"
              rm "$f"
            fi
          done
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$REL_TAG" out/* meta/title.txt \
            --repo "${{ github.repository }}" \
            --title "$REL_TAG" --notes "DLX download"
